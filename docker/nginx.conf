server_tokens off;

geo $cloudflare_edge {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

map "$cloudflare_edge:$http_cf_connecting_ip" $client_address {
    "~^1:(?<address>.+)$" $address;
    default $remote_addr;
}

limit_req_zone $client_address zone=pages:1m rate=60r/m;
limit_req_zone $client_address zone=verification:1m rate=12r/m;
limit_req_zone $client_address zone=audits:1m rate=2r/m;
limit_req_zone $client_address zone=reports:1m rate=60r/m;
limit_conn_zone $client_address zone=scans:1m;

map "$request_method $uri" $allow {
    default "GET, HEAD";
    "~^(?:GET|HEAD) " "";
    "~^POST /api/(?:verification/(?:challenge|confirm)|audits)$" "";
    "~^[A-Z]+ /api/(?:verification/(?:challenge|confirm)|audits)$" "POST";
    "~^GET /api/audits/[A-Za-z0-9_-]{43}$" "";
    "~^[A-Z]+ /api/audits/[A-Za-z0-9_-]{43}$" "GET";
}

map $uri $cache_control {
    default "no-cache";
    ~^/api/ "";
    ~^/rapport/ "";
    ~^/_astro/ "public, max-age=31536000, immutable";
    ~\.(?:ico|png|svg|txt)$ "public, max-age=86400";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /srv/aegis;
    charset utf-8;
    absolute_redirect off;
    client_max_body_size 1k;
    client_body_buffer_size 1k;
    large_client_header_buffers 4 8k;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    error_page 404 /404.html;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 2s;

    set $app_upstream http://aegis-app:4321;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $client_address;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_request_buffering on;
    proxy_buffering on;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control $cache_control always;
    add_header Allow $allow always;

    limit_req_status 429;

    if ($allow) {
        return 405;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /index {
        return 301 /;
    }

    location = /index.html {
        return 301 /;
    }

    location ~ ^/api/verification/(?:challenge|confirm)$ {
        limit_req zone=verification burst=6 nodelay;
        error_page 429 = @rate_limited;
        proxy_read_timeout 15s;
        proxy_pass $app_upstream;
    }

    location = /api/audits {
        limit_req zone=audits burst=2 nodelay;
        limit_conn scans 1;
        limit_conn_status 429;
        error_page 429 = @rate_limited;
        proxy_read_timeout 35s;
        proxy_pass $app_upstream;
    }

    location ~ "^/api/audits/[A-Za-z0-9_-]{43}$" {
        limit_req zone=reports burst=20 nodelay;
        error_page 429 = @rate_limited;
        proxy_pass $app_upstream;
    }

    location /api/ {
        return 404;
    }

    location ~ "^/rapport/[A-Za-z0-9_-]{43}$" {
        limit_req zone=pages burst=30 nodelay;
        error_page 429 = @rate_limited;
        proxy_pass $app_upstream;
    }

    location /rapport/ {
        return 404;
    }

    location @rate_limited {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        default_type application/json;
        return 429 '{"error":"Trop de requêtes. Patiente une minute avant de réessayer.","code":"rate-limited"}';
    }

    location = /404.html {
        internal;
    }

    location ~ /\. {
        return 404;
    }

    location ~ ^(?<page>/.+?)(?:/index)?\.html$ {
        return 301 $page$is_args$args;
    }

    location ~ ^(?<page>/.+)/$ {
        return 301 $page$is_args$args;
    }

    location / {
        try_files $uri $uri.html =404;
    }
}
